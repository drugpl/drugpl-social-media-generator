<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRUG #130 Event Poster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background-color: white;
            padding: 0px;
            margin: 0;
            width: 1200px;
            height: 628px;
        }
        
        .poster {
            position: relative;
            width: 1200px;
            height: 628px;
            background-color: white;
            padding-top: 40px;
	    padding-left: 40px;
            display: flex;
            flex-direction: column;
        }
        
        .event-title {
            font-size: 60px;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 20px;
        }
        
        .content-container {
            display: flex;
            flex: 1;
            gap: 40px;
        }
        
        .photo-container {
            flex-shrink: 0;
        }
        
        .speaker-photo {
            width: 400px;
            height: 400px;
            object-fit: cover;
        }
        
        .event-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            flex: 1;
        }
        
        .speaker-name {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .event-topic {
            font-size: 24px;
            font-style: italic;
            margin-bottom: 30px;
        }
        
        .event-date-time {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #e63946;
            border-radius: 4px;
            color: #e63946;
            font-weight: bold;
            font-size: 14px;
        }
        
        .date-time-text {
            font-size: 18px;
            font-weight: 500;
        }
        
        .venue-info {
            margin-top: 30px;
            font-size: 18px;
            line-height: 1.4;
        }
        
        .ruby-logo {
            position: absolute;
            bottom: 0px;
            right: 0px;
            width: 180px;
            height: 180px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="poster">
        <h1 class="event-title">DRUG #130</h1>
        
        <div class="content-container">
            <div class="photo-container">
                <img src="https://placehold.co/400x400" alt="Speaker Photo" class="speaker-photo">
            </div>
            
            <div class="event-info">
                <h2 class="speaker-name">Paweł Pacana</h2>
                <p class="event-topic">SQL Event Store a MVCC</p>
                
                <div class="event-date-time">
                    <div class="icon">17</div>
                    <div class="date-time-text">17.06.2024</div>
                </div>
                
                <div class="event-date-time">
                    <div class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                    <div class="date-time-text">19:00</div>
                </div>
                
                <div class="venue-info">
                    <p>Instytut Informatyki Uniwersytetu Wrocławskiego</p>
		    <p>Sala 119</p>
                    <p>ul. Joliot-Curie 15</p>
                    <p>Wrocław</p>
                </div>
            </div>
        </div>
        
        <div class="ruby-logo">
            <img src="./logo.svg" alt="Ruby Logo" width="100%" height="100%">
        </div>
    </div>
</body>
</html>
